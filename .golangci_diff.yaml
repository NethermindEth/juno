version: "2"
linters:
  default: none
  enable:
    - lll
    - nolintlint
    - staticcheck
    - testpackage
  settings:
    lll:
      line-length: 100
    nolintlint:
      allow-unused: false
      require-explanation: true
    staticcheck:
      checks:
        - "SA1019"
    testpackage:
      # Every test file must use the external `<pkg>_test` package, `main` included.
      # "^$" skips no file; an empty list would fall back to the default `[main]`.
      skip-regexp: "^$"
      allow-packages: [""]
  exclusions:
    rules:
      - linters:
          - lll
        source: '^//go:generate |https?://'
      - linters:
          - lll
        path: jsonrpc/(server|pretty_error)_test\.go
run:
  timeout: 10m
