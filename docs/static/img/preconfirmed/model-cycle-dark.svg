<title id="title">One polling cycle with the default options: a tick poll of 120 ms, its 250 ms fresh window, a read at 250 ms answered at once with data 250 ms old, a read at 700 ms that triggers a poll and waits 120 ms for data 120 ms old, the 1000 ms tick cancelled, and the age of the stored block as a sawtooth</title>
