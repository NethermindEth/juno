<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422" font-family="'DM Sans', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Worst-case latency and worst-case age of the answer as functions of the wait cap, for the default tick and fresh window: the latency bound rises with the cap until it equals the poll's duration and stays there, and the age bound drops from 1120 ms to 370 ms at a cap of 120 ms for an ordinary poll, or from 1240 ms to 490 ms at 240 ms for a slow poll; the 300 ms default cap covers both</title>
<desc id="desc">Worst-case latency and worst-case age of the answer as functions of the wait cap, for the default tick and fresh window: the latency bound rises with the cap until it equals the poll's duration and stays there, and the age bound drops from 1120 ms to 370 ms at a cap of 120 ms for an ordinary poll, or from 1240 ms to 490 ms at 240 ms for a slow poll; the 300 ms default cap covers both</desc>
