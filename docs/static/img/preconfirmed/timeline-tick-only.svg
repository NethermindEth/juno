<text x="16.0" y="438.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Stale-after equals the tick: stored data always counts as fresh, so a read never triggers a poll.</text>
<text x="16.0" y="455.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">A read gets data between one round trip (120 ms) and a tick plus a round trip (620 ms) old.</text>
<text x="16.0" y="472.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Measured: 2.5 gateway requests/s whatever the reads; 76% of sparse reads caught up; p50 0.7 ms.</text>
