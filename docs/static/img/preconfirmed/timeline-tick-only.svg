<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Polling on a timer only: interval 500 ms, stale-after 500 ms, wait 0</title>
<desc id="desc">The node polls every 500 ms whatever anyone reads; a read never waits and gets the last poll's data.</desc>
<rect x="0.5" y="0.5" width="759" height="487" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="16.0" y="24.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Polling on a timer only: interval 500 ms, stale-after 500 ms, wait 0</text>
<text x="16.0" y="42.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The node polls every 500 ms whatever anyone reads; a read never waits and gets the last poll's data.</text>
<rect x="16" y="57" width="16" height="10" rx="2" fill="#1baf7a" opacity="0.25"/>
<text x="38.0" y="66.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">gateway state (A, B, C, D in turn)</text>
