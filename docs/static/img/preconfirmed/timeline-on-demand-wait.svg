<title id="title">C. On-demand polling with a wait: interval 1 s, stale-after 250 ms, wait 300 ms</title>
<desc id="desc">The new default. A read that finds data older than 250 ms triggers or joins a poll and waits for it (at most 300 ms).</desc>
