name: Claude PR Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "**/*.rs"
      - "go.mod"
      - "go.sum"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC auth to Infisical
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Skip drafts, forks, and bots not on the allowlist.
    # Keep the list in sync with allowed_bots below.
    if: |
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.type != 'Bot' ||
       contains(fromJSON('["infrmtcs-agent[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write the PR for Claude
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff "$BASE_SHA...$HEAD_SHA" > pr.diff
          {
            printf '# %s\n\n%s\n\n## Commits\n' "$PR_TITLE" "$PR_BODY"
            git log --format='%h %s' "$BASE_SHA..$HEAD_SHA"
          } > pr.md

      # Exports the LiteLLM gateway virtual key into the job env as LITELLM_API_KEY.
      - name: Load gateway key from Infisical
        uses: NethermindEth/github-workflows/get_infisical_secrets@80ac29b7f614d73430a6936cc5ea85c68f45ed20 # v2.3.0
        with:
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /apps/litellm/juno-ai-reviewer

      - name: Claude review
        id: claude
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        env:
          ANTHROPIC_BASE_URL: https://litellm.nethermind.dev # org LiteLLM gateway
          # Fail a stalled gateway request fast instead of after the 10 min default.
          API_TIMEOUT_MS: "180000"
        with:
          # The gateway key doubles as the Anthropic key: the action requires
          # ANTHROPIC_API_KEY, and LiteLLM accepts it as the x-api-key header.
          anthropic_api_key: ${{ env.LITELLM_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "infrmtcs-agent[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for the Juno Starknet node (Go + some Rust).
            The checkout is the PR head. The PR's diff is in pr.diff and its title,
            description and commits are in pr.md, both at the repository root.

            Focus on:
            - Correctness bugs, race conditions, panics, nil derefs
            - Concurrency safety (goroutines, channels, mutexes)
            - Resource leaks (goroutines, file handles, db iterators, contexts)
            - Error handling — wrapped errors, ignored returns, swallowed errors
            - Protocol/consensus correctness in pkg paths under `consensus/`, `sync/`, `p2p/`
            - Performance regressions in hot paths (sync, vm, mempool, pruner)
            - Security: input validation on RPC handlers, panic-on-untrusted-input
            - Tests: meaningful assertions, table-driven coverage, no flaky time.Sleep

            Skip:
            - Style nits already covered by golangci-lint
            - Generated files (`*.pb.go`, `mocks/`)

            Post specific issues as inline comments on the relevant file:line using
            the inline comment tool. Put a short summary grouped by severity
            (blocker / important / nit) in the summary field; it is posted as the PR
            comment. If the PR is clean, say so there in one sentence and skip inline
            comments.

            CI already builds, lints and tests this PR. Do not run builds or tests.
            Use only the allowed tools: read code with Read, Grep and Glob.
          claude_args: |
            --model anthropic/claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
            --disallowedTools "Bash,Read(//proc/**),Grep(//proc/**),Glob(//proc/**),Read(//home/runner/work/_temp/**),Grep(//home/runner/work/_temp/**),Glob(//home/runner/work/_temp/**),Read(//home/runner/work/juno/juno/.git/**),Grep(//home/runner/work/juno/juno/.git/**),Glob(//home/runner/work/juno/juno/.git/**)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'

      - name: Post the review summary
        if: steps.claude.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output).summary }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"

      # Full transcript; the action hides it from the job log.
      - name: Upload Claude transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: claude-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
