name: "Build and publish Docker image"

on:
  workflow_call:
    inputs:
      repo_type:
        description: "Choose repository type"
        type: string
        default: "non-official"
      release_binaries:
        description: "Upload the Linux binaries of the images as release artifacts"
        type: boolean
        default: false
    outputs:
      tag:
        description: "The tag that was built"
        value: ${{ jobs.setup.outputs.tag }}
  workflow_dispatch:
    inputs:
      repo_type:
        description: "Choose repository type"
        type: choice
        required: false
        default: "non-official"
        options:
          - official
          - non-official

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  setup:
    if: github.repository_owner == 'NethermindEth'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set TAG output
        id: set_tag
        run: echo "tag=$(git describe --tags)" >> $GITHUB_OUTPUT

  build_and_push_docker_image_amd:
    needs: setup
    if: github.repository_owner == 'NethermindEth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Docker Hub OIDC token expires before a full build ends, so build
      # first and log in just before the push. The push steps use the cache.
      - name: Build AMD64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: debian
          platforms: linux/amd64
          outputs: type=cacheonly

      - name: Build AMD64 distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: distroless
          platforms: linux/amd64
          outputs: type=cacheonly

      # The export uses the cache, thus the release binary is the binary of the images.
      - name: Export the AMD64 binary
        if: inputs.release_binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: binary
          platforms: linux/amd64
          outputs: type=local,dest=binary

      - name: Package the AMD64 binary
        if: inputs.release_binaries
        env:
          ARTIFACT_NAME: juno-${{ needs.setup.outputs.tag }}-linux-amd64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl
          cp binary/juno "$ARTIFACT_NAME"
          upx "$ARTIFACT_NAME"
          "./$ARTIFACT_NAME" --help > /dev/null
          sha256sum "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          zip "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME" "$ARTIFACT_NAME.sha256"

      - name: Upload the AMD64 binary
        if: inputs.release_binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: juno-${{ needs.setup.outputs.tag }}-linux-amd64.zip
          path: juno-${{ needs.setup.outputs.tag }}-linux-amd64.zip
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push AMD64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: debian
          platforms: linux/amd64
          push: true
          tags: nethermindeth/juno:${{ needs.setup.outputs.tag }}

      - name: Push AMD64 distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: distroless
          platforms: linux/amd64
          push: true
          tags: nethermindeth/juno:${{ needs.setup.outputs.tag }}-distroless

      # The release binary comes from a separate export. Make sure that the pushed images contain
      # the same binary. A failure here stops the draft release.
      - name: Check that the AMD64 images contain the release binary
        if: inputs.release_binaries
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for image in "nethermindeth/juno:$TAG" "nethermindeth/juno:$TAG-distroless"; do
            docker pull -q "$image"
            container=$(docker create "$image")
            docker cp "$container:/usr/local/bin/juno" image-juno
            docker rm "$container" > /dev/null
            if ! cmp image-juno binary/juno; then
              echo "::error::$image does not contain the release binary of this build."
              exit 1
            fi
          done

  build_and_push_docker_image_arm:
    needs: setup
    if: github.repository_owner == 'NethermindEth'
    runs-on: ubuntu-arm64-4-core
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Docker Hub OIDC token expires before a full build ends, so build
      # first and log in just before the push. The push steps use the cache.
      - name: Build ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: debian
          platforms: linux/arm64
          outputs: type=cacheonly

      - name: Build ARM64 distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: distroless
          platforms: linux/arm64
          outputs: type=cacheonly

      # The export uses the cache, thus the release binary is the binary of the images.
      - name: Export the ARM64 binary
        if: inputs.release_binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: binary
          platforms: linux/arm64
          outputs: type=local,dest=binary

      - name: Package the ARM64 binary
        if: inputs.release_binaries
        env:
          ARTIFACT_NAME: juno-${{ needs.setup.outputs.tag }}-linux-arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl
          cp binary/juno "$ARTIFACT_NAME"
          upx "$ARTIFACT_NAME"
          "./$ARTIFACT_NAME" --help > /dev/null
          sha256sum "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          zip "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME" "$ARTIFACT_NAME.sha256"

      - name: Upload the ARM64 binary
        if: inputs.release_binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: juno-${{ needs.setup.outputs.tag }}-linux-arm64.zip
          path: juno-${{ needs.setup.outputs.tag }}-linux-arm64.zip
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: debian
          platforms: linux/arm64
          push: true
          tags: nethermindeth/juno:${{ needs.setup.outputs.tag }}-arm64

      - name: Push ARM64 distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          target: distroless
          platforms: linux/arm64
          push: true
          tags: nethermindeth/juno:${{ needs.setup.outputs.tag }}-distroless-arm64

      # The release binary comes from a separate export. Make sure that the pushed images contain
      # the same binary. A failure here stops the draft release.
      - name: Check that the ARM64 images contain the release binary
        if: inputs.release_binaries
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for image in "nethermindeth/juno:$TAG-arm64" "nethermindeth/juno:$TAG-distroless-arm64"; do
            docker pull -q "$image"
            container=$(docker create "$image")
            docker cp "$container:/usr/local/bin/juno" image-juno
            docker rm "$container" > /dev/null
            if ! cmp image-juno binary/juno; then
              echo "::error::$image does not contain the release binary of this build."
              exit 1
            fi
          done

      - name: Cleanup self-hosted
        run: docker system prune -af

  create_and_push_official_image:
    needs:
      - setup
      - build_and_push_docker_image_amd
      - build_and_push_docker_image_arm
    if: github.repository_owner == 'NethermindEth' && inputs.repo_type == 'official'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_RELEASE_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_RELEASE_ORGANIZATION }}

      - name: Create and push manifest using buildx
        run: |
          docker buildx imagetools create \
            nethermindeth/juno:${{ needs.setup.outputs.tag }} \
            nethermindeth/juno:${{ needs.setup.outputs.tag }}-arm64 \
            --tag nethermind/juno:${{ needs.setup.outputs.tag }}

      - name: Create and push distroless manifest using buildx
        run: |
          docker buildx imagetools create \
            nethermindeth/juno:${{ needs.setup.outputs.tag }}-distroless \
            nethermindeth/juno:${{ needs.setup.outputs.tag }}-distroless-arm64 \
            --tag nethermind/juno:${{ needs.setup.outputs.tag }}-distroless

      - name: Clean up Docker config
        if: always()
        run: rm -f ${HOME}/.docker/config.json

