name: Build Binaries

# Builds the macOS release binaries. The Linux release binaries come from the Docker build, see the
# build-image job of release.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Empty builds the commit that started the workflow."
        type: string
        default: ""
      version:
        description: "Tag to create locally before the build, so that git describe returns it. Empty creates no tag."
        type: string
        default: ""
      no-cache:
        description: "Do not restore or save the Go and Rust caches"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the release commit locally
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Only the release tag may decide git describe: a fetched tag could win and carry shell code.
          git for-each-ref --format='delete %(refname)' refs/tags | git update-ref --stdin
          git tag "$VERSION"

      - name: Install dependencies
        run: brew install jemalloc

      - name: Record the Jemalloc library path
        run: pkg-config --variable=libdir jemalloc > .jemalloc-libdir

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.no-cache }}
          cache-dependency-path: |
            go.mod
            go.sum
            .jemalloc-libdir

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        if: ${{ !inputs.no-cache }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-toolchain-${{ matrix.os }}
          workspaces: vm/rust

      - name: Get artifact name
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "ARTIFACT_NAME=juno-$(git describe --tags)-darwin-$ARCH" >> "$GITHUB_ENV"

      - name: Build binary
        run: make juno

      - name: Verify the binary was built with the Go toolchain in go.mod
        run: make check-go-build

      - name: Zip binary and checksum
        run: |
          mv build/juno "$ARTIFACT_NAME"
          shasum -a 256 "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          zip "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME" "$ARTIFACT_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: 30
