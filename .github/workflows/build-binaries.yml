name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Empty builds the commit that started the workflow."
        type: string
        default: ""
      version:
        description: "Tag to create locally before the build, so that git describe returns it. Empty creates no tag."
        type: string
        default: ""
      no-cache:
        description: "Do not restore or save the Go and Rust caches"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-15-intel
            arch: amd64
          - os: ${{ vars.ARM64_LINUX_RUNNER || 'ubuntu-arm64-4-core' }}
            arch: arm64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the release commit locally
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Only the release tag may decide git describe: a fetched tag could win and carry shell code.
          git for-each-ref --format='delete %(refname)' refs/tags | git update-ref --stdin
          git tag "$VERSION"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl libjemalloc-dev libjemalloc2 libbz2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jemalloc

      - name: Record the Jemalloc library path
        run: pkg-config --variable=libdir jemalloc > .jemalloc-libdir

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.no-cache }}
          cache-dependency-path: |
            go.mod
            go.sum
            .jemalloc-libdir

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.94.1"

      - name: Cache Rust dependencies
        if: ${{ !inputs.no-cache }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          key: rust-toolchain-${{ matrix.os }}
          workspaces: vm/rust

      - name: Set TAG env var
        run: echo "TAG=$(git describe --tags)" >> $GITHUB_ENV

      - name: Get artifact name
        run: |
          OS_NAME=$([ "${{ runner.os }}" == "macOS" ] && echo "darwin" || echo "linux")
          echo "ARTIFACT_NAME=juno-${TAG}-${OS_NAME}-${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Build binary
        run: make juno

      - name: Compress binary (Linux)
        if: runner.os == 'Linux'
        run: |
          upx build/juno
          mv build/juno "${ARTIFACT_NAME}"

      - name: Prepare binary (macOS)
        if: runner.os == 'macOS'
        run: mv build/juno "${ARTIFACT_NAME}"

      - name: Generate checksum
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
          else
            sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
          fi

      - name: Zip binary and checksum
        run: |
          zip "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}" "${ARTIFACT_NAME}.sha256"
          rm "${ARTIFACT_NAME}" "${ARTIFACT_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: 30
