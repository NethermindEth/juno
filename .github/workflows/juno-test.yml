name: Juno Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-arm64-4-core]
    runs-on: ${{ matrix.os }}
    env:
      VM_DEBUG: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect consensus changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            consensus:
              - 'consensus/**'
              - 'p2p/**'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/juno-test.yml'

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          key: rust-toolchain-${{ matrix.os }}
          workspaces: |
            vm/rust
            starknet/compiler/rust

      - name: Install deps
        run: make install-deps

      - name: Install Jemalloc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libjemalloc-dev libjemalloc2 libbz2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jemalloc

      - name: Tests (Coverage)
        if: matrix.os == 'ubuntu-latest'
        env:
          FULL_TESTS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.consensus == 'true' }}
        run: make test-cover

      - name: Tests (No Coverage)
        if: matrix.os != 'ubuntu-latest'
        env:
          FULL_TESTS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.consensus == 'true' }}
        run: make test

      #    Tests with race condition detector are flaky; we're disabling them for now
      #      - name: Tests (Race Detection)
      #        if: matrix.os == 'ubuntu-latest'
      #        run: make test-race

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: coverage/coverage.old.out,coverage/coverage.new.out

  # TODO(granza): Delete this job and move slice_jsonv2.go into slice.go once jsonv2 is default
  test-jsonv2:
    name: Run Tests (jsonv2)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: |
            vm/rust
            starknet/compiler/rust

      # vm links against -lbz2, and the rpc tests import node, which links jemalloc
      - name: Install bzip2 and Jemalloc
        run: sudo apt-get update -qq && sudo apt-get install -y libbz2-dev libjemalloc-dev libjemalloc2

      - name: Fail once jsonv2 is no longer an experiment
        run: |
          if GOEXPERIMENT= go list encoding/json/v2 >/dev/null 2>&1; then
            echo "::error::json/v2 builds without GOEXPERIMENT now, so this job is a"
            echo "::error::duplicate of Run Tests. Delete it and move the body of"
            echo "::error::core/felt/slice_jsonv2.go into core/felt/slice.go."
            exit 1
          fi

      - name: Verify the build tag is applied
        run: go list -f '{{join .GoFiles "\n"}}' ./core/felt | grep -qx slice_jsonv2.go

      - name: Build the Rust libraries that rpc links against
        run: make rustdeps

      # jsonrpc is left out: it fails under the experiment on Go 1.26 because the
      # offset reported for a JSON parse error shifts.
      # It is a toolchain bug, fixed in Go 1.27 (go.dev/issue/79659).
      - name: Tests
        env:
          CGO_LDFLAGS: -ldl -lm
        run: go test -short -count=1 -coverpkg=./core/...,./rpc/... -coverprofile=coverage.out -covermode=atomic ./core/... ./rpc/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: coverage.out
          flags: jsonv2
