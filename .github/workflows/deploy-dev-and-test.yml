name: Deploy and Test on Dev

on:
  merge_group:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # Skip for PRs from forks as they don't have access to secrets. Also skip for non-fork PRs with "disable-deploy-test" label
    if: github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && !contains(github.event.pull_request.labels.*.name, 'disable-deploy-test'))
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yaml

  smoke_test_100_blocks:
    needs: [build]
    uses: ./.github/workflows/smoke-test.yaml
    with:
      docker_image_tag: ${{ needs.build.outputs.docker_image_tag }}
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  dev_deploy_test:
    needs: [build]
    uses: ./.github/workflows/deploy-and-test.yaml
    with:
      docker_image_tag: ${{ needs.build.outputs.docker_image_tag }}
      environment: Development
      source_repo: nubia-oci-local-dev
      target_repo: nubia-oci-local-dev
      test_mode: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
    secrets:
      RPC_URL: ${{ secrets.DEV_SEPOLIA_URL }}
      WS_RPC_URL: ${{ secrets.DEV_WS_SEPOLIA_URL }}
      TEST_ACCOUNT_ADDRESS: ${{ secrets.TEST_ACCOUNT_ADDRESS }}
      TEST_ACCOUNT_PRIVATE_KEY: ${{ secrets.TEST_ACCOUNT_PRIVATE_KEY }}
      TEST_ACCOUNT_ADDRESS_2: ${{ secrets.TEST_ACCOUNT_ADDRESS_2 }}
      TEST_ACCOUNT_PRIVATE_KEY_2: ${{ secrets.TEST_ACCOUNT_PRIVATE_KEY_2 }}
      TEST_ACCOUNT_ADDRESS_3: ${{ secrets.TEST_ACCOUNT_ADDRESS_3 }}
      TEST_ACCOUNT_PRIVATE_KEY_3: ${{ secrets.TEST_ACCOUNT_PRIVATE_KEY_3 }}
      TEST_ACCOUNT_PUBLIC_KEY_3: ${{ secrets.TEST_ACCOUNT_PUBLIC_KEY_3 }}
      AUTH_TOKEN: ${{ secrets.DEV_AUTH_TOKEN }}

  image_scan:
    # Scan the image that "build" pushed, so the PR does not build it a second time.
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    env:
      DOCKER_REGISTRY: nethermind.jfrog.io
      REPO_DEV: nubia-oci-local-dev
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1e584506871998c267b7c100c02628a5b9c81db6 # v5.3.0
        env:
          JF_URL: https://${{ env.DOCKER_REGISTRY }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Login to Registry with OIDC
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Pull docker image
        env:
          DOCKER_TAG: ${{ needs.build.outputs.docker_image_tag }}
        run: |
          docker pull "${DOCKER_REGISTRY}/${REPO_DEV}/juno:${DOCKER_TAG}"
          # Same image name as in trivy.yml, so alert locations match the ones on main.
          docker tag "${DOCKER_REGISTRY}/${REPO_DEV}/juno:${DOCKER_TAG}" "juno:${{ github.sha }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: 'juno:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 #v4.39.3
        with:
          # Scan on main uploads from trivy.yml with this category. The PR result must match it so GitHub can compare.
          category: .github/workflows/trivy.yml:build
          sarif_file: 'trivy-results.sarif'
