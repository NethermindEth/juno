version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild, analyze and upload-sarif must run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
